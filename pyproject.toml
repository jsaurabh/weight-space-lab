[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weight-space-lab"
version = "0.1.0"
description = "CPU experiments in programming tiny transformer weights without training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "openai>=2,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
qwen = ["transformers>=5.20.2,<6", "accelerate>=1,<2", "safetensors>=0.6,<1", "math-verify==0.9.0"]

[project.scripts]
weight-space-lab = "weight_space_lab.cli:main"
weight-space-discover = "weight_space_lab.discovery:main"
weight-space-qwen = "weight_space_lab.qwen:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_space_lab"]
