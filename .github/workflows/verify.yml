name: Verify CPU experiments
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra qwen
      - run: uv run --extra qwen python -m unittest discover -s tests -v
      - run: uv run --extra qwen weight-space-lab run --task all --output results/ci
